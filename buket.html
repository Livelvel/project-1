            .kelopak{
                position:relative;
                width:50px;
                height:50px;
                background-color: pink;
                border-radius: 50%;
                z-index: 1;
            }
            .kelopak::before,
            .kelopak::after{
                content:"";
                position: absolute;
                width: 40px;
                height: 40px;
                background-color: pink;
                border-radius: 50%;
            }
            .kelopak::before{
                top: -18px;
                left:0;
            }
            .kelopak::after{
                top:0;
                left:18px;
            }
            .kelopak{
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .tengah-bunga{
                position: absolute;
                width: 18px;
                height: 18px;
                background: #f8eeb2;
                border-radius: 50%;
                top:16px;
                left:16px;
                z-index:2;
            }
            .daun{
                width: 30px;
                height: 50px;
                background-color: lightgreen;
                border-radius: 100% 0 100% 0;
                position: absolute;
                left: -3px;
                top:55px;
                transform: rotate(-50deg);
            }
            .batang{
                width: 5px;
                height: 100px;
                background-color: green;
                margin:auto;
            }
            .bungkus{
                position: absolute;
                width: 150px;
                height:180px;
                background:#f8eeb2;
                top: 250px;
                left: 50px;
                clip-path: polygon(0% 0%, 100% 0, 60% 100%,40 100%);
            }
            .bunga.goyang{
                position: absolute;
                animation: goyang 0.6s ease-in-out;
            }
            .amplop{
                position: relative;
                top:0;
                width: 260px;
                height:170px;
                margin: 150px auto 20px;
                left:-15px;
                perspective: 600px;
            }
            .surat-dalam{
                position: absolute;
                width: 260px;
                height: 160px;
                background:#ffd3fb;
                left:5px;
                top:5px;
            }
            .surat-kecil{
                position: absolute;
                width: 150px;
                height: 85px;
                background: white;
                left: 55px;
                top:40px;
                z-index:1;
                transition: transform 1s ease;
                transform:translateY(60px);
            }
            .depan-amplop{
                position: absolute;
                width: 260px;
                height:95px;
                background:#ffd3fb;
                left:5px;
                bottom:-20px;
                z-index: 2;
            }
            .tutup{
                transition: transform 1.5s ease-in-out;
                transform-origin: top center;
                position: absolute;
                width: 0;
                height: 0;
                border-left: 125px solid transparent;
                border-right: 125px solid transparent;
                border-top: 85px solid #d9b7e4;
                top: 5px;
                left: 5px;
            }
            .amplop.buka .tutup{
                transform: rotateX(180deg);
            }
            .amplop.buka .surat-kecil{
                transform:translateY(-60px);
            }
            @keyframes goyang{
                0%{
                    rotate: 0deg;
                }
                25%{
                    rotate: -6deg;
                }
                50%{
                    rotate: 6deg;
                }
                75%{
                    rotate: -4deg;
                }
                100%{
                    rotate: 0deg;
                }
            }
            @media (max-width: 600px){
                .kalender{
                    width: 90%;
                    height: auto;
                    padding-bottom: 15px;
                }
                h1{
                    width:100%;
                    height: 50px;
                }
                .buket{
                    transform: scale(0.85);
                    transform-origin: top center;
                    margin-bottom: -50px;
                }
                .amplop{
                    transform: scale(0.85);
                    transform-origin: top center;
                    margin-top: 100px;
                    margin-bottom: -20px;
                }
            }
        </style>

        <script>

                window.location.href="surat.html";

            document.querySelectorAll(".bunga").forEach(function(bunga){
